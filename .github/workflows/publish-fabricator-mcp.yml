# Publishes fabricator-mcp to PyPI via Trusted Publishing when a tag
# matching `fabricator-mcp-v*` is pushed (e.g. fabricator-mcp-v0.1.0).
#
# ---------------------------------------------------------------------
# ONE-TIME SETUP (do this once, before the first tag push, on pypi.org):
#   1. Create the `fabricator-mcp` project on PyPI. Trusted Publishing
#      lets you register a "pending publisher" for a project name that
#      doesn't exist yet:
#      https://pypi.org/manage/account/publishing/
#   2. Add a new pending publisher with:
#        PyPI Project Name : fabricator-mcp
#        Owner             : adrianmelian
#        Repository name   : FabricatorStudio
#        Workflow name      : publish-fabricator-mcp.yml
#        Environment name    : pypi   (must match the `environment:` below)
#   3. In this GitHub repo: Settings -> Environments -> New environment
#      named `pypi`. (Optional but recommended: add required reviewers
#      so every publish needs a manual approval click.)
#   4. No PyPI API token is needed anywhere. Trusted Publishing uses
#      short-lived OIDC tokens minted per-run; nothing to store as a
#      GitHub secret, nothing to rotate.
#
# To ship a release: bump `version` in fabricator-mcp/pyproject.toml,
# commit, then push a tag `fabricator-mcp-vX.Y.Z` matching that version.
# ---------------------------------------------------------------------

name: Publish fabricator-mcp

on:
  push:
    tags:
      - "fabricator-mcp-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build fabricator-mcp

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabricator-mcp-dist
          path: fabricator-mcp/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fabricator-mcp
    permissions:
      id-token: write  # required for PyPI Trusted Publishing
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: fabricator-mcp-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
